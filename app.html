const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me,people=[],projects=[],entries=[],view='today',edit=null;const today=()=>{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Tirane',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return ['year','month','day'].map(t=>parts.find(p=>p.type===t).value).join('-')};let selectedDay=today(),period='week',anchor=today(),employee='',projectFilter='';const hours=n=>(n/60).toLocaleString(undefined,{maximumFractionDigits:2});
function notice(s,error=false){$('notice').textContent=s;$('notice').className=error?'error':'';$('notice').hidden=false;setTimeout(()=>$('notice').hidden=true,6500)}
async function api(path,method='GET',body){const r=await fetch('/api/'+path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok){if(r.status===401&&me){me=null;await loginScreen()}throw Error(data.error)}return data}
async function action(fn){try{await fn()}catch(e){notice(e.message,true)}}
function bindForm(id,fn){$(id).onsubmit=e=>{e.preventDefault();const b=e.submitter;b.disabled=true;action(()=>fn(Object.fromEntries(new FormData(e.target)))).finally(()=>b.disabled=false)}}
async function loginScreen(){const pub=await api('public');$('app').innerHTML='<div class="login"><div class="brand">◷ Team <b>Hours</b></div><div class="eyebrow">A little structure. A clearer week.</div><h1>'+ (pub.setup?'Set up your workspace':'Welcome back.')+'</h1><p class="muted">'+(pub.setup?'Create the first administrator to get your team started.':'Choose your name and enter your PIN.')+'</p><form id="login" class="card">'+(pub.setup?'<label for="token">Setup key</label><input id="token" name="token" type="password" required autocomplete="off"><label for="name">Your name</label><input id="name" name="name" required maxlength="100">':'<label for="id">Your name</label><select id="id" name="id" required><option value="">Choose your name</option>'+pub.people.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('')+'</select>')+'<label for="pin">'+(pub.setup?'Choose a PIN (6–12 digits)':'Your PIN')+'</label><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{6,12}" required autocomplete="'+(pub.setup?'new-password':'current-password')+'"><button type="submit">'+(pub.setup?'Create workspace':'Sign in →')+'</button></form><small>Individual access. Shared clarity.</small></div>';bindForm('login',async data=>{await api(pub.setup?'setup':'login','POST',data);if(pub.setup){notice('Workspace created. Sign in to continue.');await loginScreen()}else await boot()})}
function shell(){ $('app').innerHTML='<div class="shell"><aside><div class="brand">◷ Team <b>Hours</b></div><nav>'+[['today','◷  Timesheet'],['reports','▥  Reports'],...(me.role==='admin'?[['admin','⚙  Workspace']]:[]),['account','◎  My account']].map(([k,n])=>'<button data-view="'+k+'" class="'+(view===k?'active':'')+'">'+n+'</button>').join('')+'</nav><footer><div><strong>'+esc(me.name)+'</strong><br><span>'+esc(me.role)+'</span></div><button class="secondary" id="logout">Sign out</button></footer></aside><main id="main"></main></div>';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{if(!leaveSheet())return;sheetDirty=false;view=b.dataset.view;edit=null;action(render)});$('logout').onclick=()=>action(async()=>{if(!leaveSheet())return;sheetDirty=false;await api('logout','POST',{});me=null;await loginScreen()})}
async function boot(){me=await api('me');await render()}
async function render(){[people,projects]=await Promise.all([api('people'),api('projects')]);shell();if(view==='today')await weekly();if(view==='reports')await reports();if(view==='admin')admin();if(view==='account')account()}
const header=(eyebrow,title,sub)=>'<div class="top"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><small>'+sub+'</small></div><span class="pill">● Shared workspace</span></div>';

row"><h2 style="margin:0">'+(me.role==='member'?'Your entries':'Team entries')+'</h2><input aria-label="View entries for date" type="date" id="viewday" value="'+selectedDay+'"></div><div style="margin-top:15px">'+(entries.length?entries.map(e=>'<div class="entry"><div><strong>'+esc(e.project_name)+'</strong><small>'+esc(e.employee)+(e.project_active?'':' · Archived project')+'</small>'+(e.note?'<p>'+esc(e.note)+'</p>':'')+(e.person===me.id?'<div class="tools"><button class="secondary" data-edit="'+e.id+'">Edit</button><button class="danger" data-delete="'+e.id+'">Delete</button></div>':'')+'</div><strong>'+hours(e.minutes)+' h</strong></div>').join(''):'<div class="empty">No hours recorded for this day.<br>Your next entry starts here.</div>')+'</div></section></div>';

 // Export is installed below; all values come from the current employee's table.
 $('#export-sheet').onclick=()=>{

 const pad=30,projectWidth=260,dayWidth=72,totalWidth=100,rowHeight=60,tableY=135,headerHeight=76;

 if(width*height>16000000){$('#week-status').textContent='Too many project rows for one image. Remove some rows from this view and try again.';return}
 const scale=Math.min(3,Math.sqrt(32000000/(width*height)),16000/width,16000/height);const canvas=document.createElement('canvas');canvas.width=Math.round(width*scale);canvas.height=Math.round(height*scale);const ctx=canvas.getContext('2d');
 if(!ctx){$('#week-status').textContent='Image export is unavailable in this browser.';return}ctx.scale(scale,scale);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';

 const label=(name,x,y)=>{ctx.font='500 15px system-ui, sans-serif';const words=name.split(/\s+/);let line='',lines=[];for(const word of words){if(line&&ctx.measureText(line+' '+word).width>projectWidth-30){lines.push(line);line=word}else line+=(line?' ':'')+word}if(line)lines.push(line);lines=lines.slice(0,2);lines.forEach((v,i)=>{while(ctx.measureText(v).width>projectWidth-30)v=v.slice(0,-1);text(v,x,y+(i-(lines.length-1)/2)*18,15,colors.text,'left',500)})};
 rect(0,0,width,height,colors.bg);text('Team Hours',pad,35,24,colors.green,'left',600);text(sheetMode==='month'?'Monthly timesheet':'Weekly timesheet',pad,75,20,colors.text,'left',600);text(selected.name+' · '+$('#week-label').textContent,pad,104,14,colors.sub);

 rect(pad,tableY,tableWidth,headerHeight,colors.panel);text('Project',pad+15,tableY+38,15,colors.text,'left',600);
 dates.forEach((d,c)=>{const x=pad+projectWidth+c*dayWidth;if([0,6].includes(d.getUTCDay()))rect(x,tableY,dayWidth,headerHeight,colors.soft);if(key(d)===today())rect(x,tableY,dayWidth,3,colors.green);text(d.toLocaleDateString('en-GB',{weekday:'short',timeZone:'UTC'}),x+dayWidth/2,tableY+25,13,colors.sub,'center');text(d.getUTCDate(),x+dayWidth/2,tableY+51,20,colors.text,'center')});text('Total hours',totalX+totalWidth/2,tableY+38,14,colors.text,'center',600);
 exportRows.forEach((p,r)=>{const y=tableY+headerHeight+r*rowHeight;rect(pad,y,tableWidth,rowHeight,colors.panel);label(p.name,pad+15,y+rowHeight/2);dates.forEach((d,c)=>{const x=pad+projectWidth+c*dayWidth;if([0,6].includes(d.getUTCDay()))rect(x,y,dayWidth,rowHeight,colors.soft);text(hourValue(p.r,d)?fmt(hourValue(p.r,d)):'—',x+dayWidth/2,y+rowHeight/2,16,colors.text,'center')});text(fmt(dates.reduce((sum,d)=>sum+hourValue(p.r,d),0)),totalX+totalWidth/2,y+rowHeight/2,16,colors.text,'center',600);rect(pad,y,tableWidth,1,colors.line)});
 const y=tableY+headerHeight+exportRows.length*rowHeight;rect(pad,y,tableWidth,rowHeight,colors.soft);text('Daily total',pad+15,y+rowHeight/2,16,colors.text,'left',600);sums.forEach((v,c)=>text(fmt(v),pad+projectWidth+c*dayWidth+dayWidth/2,y+rowHeight/2,16,colors.text,'center',600));text(fmt(sums.reduce((a,b)=>a+b,0)),totalX+totalWidth/2,y+rowHeight/2,17,colors.green,'center',600);
 text('Hours · '+key(dates[0])+' to '+key(dates.at(-1)),pad,height-25,12,colors.sub);
 canvas.toBlob(blob=>{if(!blob){$('#week-status').textContent='Could not create image. Please try again.';return}const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='team-hours-'+selected.name.replace(/[^a-z0-9_-]/gi,'-')+'-'+sheetMode+'-'+key(dates[0])+'-to-'+key(dates.at(-1))+'.png';root.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);$('#week-status').textContent='High-resolution PNG requested · '+canvas.width+' × '+canvas.height+' pixels.'},'image/png');
};

 await load();
